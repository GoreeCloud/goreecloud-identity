name: GoreeCloud Native Identity Contract

on:
  pull_request:
    paths:
      - "contracts/native-account-model.v1.json"
      - "scripts/goreecloud/validate_native_account_model.py"
      - "docs/goreecloud/NATIVE-ACCOUNT-MODEL.md"
      - "FEATURE-ROADMAP.md"
      - ".github/workflows/native-account-model.yml"
  push:
    branches: [main]
    paths:
      - "contracts/native-account-model.v1.json"
      - "scripts/goreecloud/validate_native_account_model.py"
      - "docs/goreecloud/NATIVE-ACCOUNT-MODEL.md"
      - "FEATURE-ROADMAP.md"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source revision
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
      - name: Validate native account model contract
        run: python3 scripts/goreecloud/validate_native_account_model.py
      - name: Validate JSON syntax
        run: python3 -m json.tool contracts/native-account-model.v1.json >/dev/null
      - name: Compile validator
        run: python3 -m py_compile scripts/goreecloud/validate_native_account_model.py
