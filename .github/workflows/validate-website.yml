name: Validate Identity Center website

on:
  pull_request:
    paths:
      - 'identity-center-site/**'
      - 'scripts/build_identity_public_site.py'
      - 'scripts/validate_identity_public_site.py'
      - '.github/workflows/validate-website.yml'
      - 'WEBSITE.md'
      - 'BRANDING.md'
  push:
    branches: [main]
    paths:
      - 'identity-center-site/**'
      - 'scripts/build_identity_public_site.py'
      - 'scripts/validate_identity_public_site.py'
      - '.github/workflows/validate-website.yml'
      - 'WEBSITE.md'
      - 'BRANDING.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out pinned GLAZE UI V1.1 Stable source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: GoreeCloud/goreecloud-glaze-ui
          ref: 15cc76d2bcd4065552dc31c77145b63f34d9e7b2
          path: .glaze-ui
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13'
      - name: Compile website tools
        run: python -m py_compile scripts/build_identity_public_site.py scripts/validate_identity_public_site.py
      - name: Validate isolated public website
        env:
          GLAZE_UI_SOURCE: ${{ github.workspace }}/.glaze-ui
        run: python scripts/validate_identity_public_site.py
