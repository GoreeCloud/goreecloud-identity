name: GoreeCloud Mesh Service Token

on:
  push:
    branches: [main]
    paths:
      - "authentik/goreecloud/**"
      - "tests/goreecloud/test_mesh_service_token.py"
      - "contracts/mesh-service-token.v1.json"
      - ".github/workflows/goreecloud-mesh-service-token.yml"
  pull_request:
    paths:
      - "authentik/goreecloud/**"
      - "tests/goreecloud/test_mesh_service_token.py"
      - "contracts/mesh-service-token.v1.json"
      - ".github/workflows/goreecloud-mesh-service-token.yml"

permissions:
  contents: read

concurrency:
  group: goreecloud-mesh-service-token-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install isolated token test dependencies
        run: python -m pip install --disable-pip-version-check "cryptography==50.0.0" "PyJWT==2.13.0" "pytest==9.1.1"

      - name: Validate Mesh service token issuer
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest -q -c /dev/null tests/goreecloud/test_mesh_service_token.py

      - name: Validate token profile contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          profile = json.loads(Path("contracts/mesh-service-token.v1.json").read_text())
          signing = profile["signing"]
          lifetime = profile["lifetime"]
          runtime = profile["runtime_implementation"]

          assert profile["schema_version"] == "1.2.0"
          assert profile["token_profile"] == "goreecloud-identity.mesh-service-token.v1"
          assert profile["issuer"] == "goreecloud-identity"
          assert profile["audience"] == "goreecloud-mesh"
          assert signing["algorithms"] == ["RS256"]
          assert signing["minimum_rsa_key_bits"] == 2048
          assert signing["rsa_public_exponent"] == "odd integer greater than or equal to 3"
          assert signing["kid_pattern"] == "^[A-Za-z0-9._-]{8,128}$"
          assert signing["kid_minimum_bytes"] == 8
          assert signing["kid_maximum_bytes"] == 128
          assert signing["jwks_media_type"] == "application/json"
          assert lifetime["default_seconds"] == 300
          assert lifetime["maximum_seconds"] == 900
          assert lifetime["clock_skew_seconds"] == 60
          assert runtime["durable_private_key_storage_integrated"] is False
          assert runtime["jwks_endpoint_deployed"] is False
          assert runtime["live_service_issuance_deployed"] is False
          assert profile["production_acceptance"] is False
          PY
