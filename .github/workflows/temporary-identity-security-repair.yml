name: Temporary Identity security repair

on:
  push:
    branches:
      - revamp/identity-center-current-truth-20260831
    paths:
      - .github/workflows/temporary-identity-security-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0

      - name: Restore the known-good workspace manifest and apply only the patched rustls pin
        shell: bash
        run: |
          set -euo pipefail
          git show 0f170d9ea0abd9253cbe1d16eeb06bdf743fab4d:Cargo.toml > Cargo.toml
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.toml")
          text = path.read_text(encoding="utf-8")
          old = 'rustls = { version = "= 0.23.43", features = ["fips"] }'
          new = 'rustls = { version = "= 0.23.45", features = ["fips"] }'
          if text.count(old) != 1:
              raise SystemExit("expected exactly one rustls 0.23.43 workspace pin")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v5

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version-file: pyproject.toml

      - name: Format the exact failing Python file with the repository-pinned Black version
        shell: bash
        run: uv tool run --from black==26.5.1 black scripts/build_identity_public_site.py

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          rustflags: ""

      - name: Install cargo-deny
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2
        with:
          tool: cargo-deny

      - name: Regenerate only the patched rustls dependency graph
        shell: bash
        run: |
          set -euo pipefail
          cargo update -p rustls --precise 0.23.45
          cargo metadata --locked --format-version 1 >/dev/null
          cargo deny --config "${GITHUB_WORKSPACE}/.cargo/deny.toml" --locked --workspace check
          uv tool run --from black==26.5.1 black --check scripts/build_identity_public_site.py

      - name: Enforce bounded repair diff
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(Cargo\.toml|Cargo\.lock|scripts/build_identity_public_site\.py)$' || true)"
          if [[ -n "$unexpected" ]]; then
            printf 'Unexpected repair paths:\n%s\n' "$unexpected" >&2
            exit 1
          fi
          git diff --check
          git diff -- Cargo.toml Cargo.lock scripts/build_identity_public_site.py

      - name: Commit generated repair to the existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.toml Cargo.lock scripts/build_identity_public_site.py; then
            echo "No repair changes were generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock scripts/build_identity_public_site.py
          git commit -m "fix: repair Identity security dependency state"
          git push origin HEAD:revamp/identity-center-current-truth-20260831
