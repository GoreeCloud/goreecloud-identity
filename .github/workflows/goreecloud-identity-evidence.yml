name: GoreeCloud Identity Evidence Contract

on:
  push:
    branches: [main]
    paths:
      - "contracts/identity.evidence.schema.json"
      - "contracts/identity.mesh-evidence-profile.json"
      - "contracts/mesh-service-token.v1.json"
      - "tests/goreecloud/test_identity_evidence_contract.py"
      - ".github/workflows/goreecloud-identity-evidence.yml"
  pull_request:
    paths:
      - "contracts/identity.evidence.schema.json"
      - "contracts/identity.mesh-evidence-profile.json"
      - "contracts/mesh-service-token.v1.json"
      - "tests/goreecloud/test_identity_evidence_contract.py"
      - ".github/workflows/goreecloud-identity-evidence.yml"

permissions:
  contents: read

concurrency:
  group: goreecloud-identity-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validate contract JSON syntax
        run: |
          python -m json.tool contracts/identity.evidence.schema.json > /dev/null
          python -m json.tool contracts/identity.mesh-evidence-profile.json > /dev/null
          python -m json.tool contracts/mesh-service-token.v1.json > /dev/null

      - name: Validate evidence and credential authority separation
        run: |
          python -m pip install --disable-pip-version-check "pytest==9.1.1"
          python -m pytest -q tests/goreecloud/test_identity_evidence_contract.py
