name: Identity Black Diagnostic

on:
  pull_request:

permissions:
  contents: read

jobs:
  black-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python 3.14
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.14"
      - name: Install exact Black formatter
        run: python -m pip install --disable-pip-version-check black==26.5.1
      - name: Show exact Black diff
        run: black --check --diff scripts/validate_identity_public_site.py
