name: GoreeCloud Consumer Directory

on:
  push:
    branches: [main]
    paths:
      - "authentik/goreecloud/consumer_directory.py"
      - "tests/goreecloud/test_consumer_directory.py"
      - ".github/workflows/goreecloud-consumer-directory.yml"
  pull_request:
    paths:
      - "authentik/goreecloud/consumer_directory.py"
      - "tests/goreecloud/test_consumer_directory.py"
      - ".github/workflows/goreecloud-consumer-directory.yml"

permissions:
  contents: read

concurrency:
  group: goreecloud-consumer-directory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install isolated directory test dependency
        run: python -m pip install --disable-pip-version-check "pytest==9.1.1"

      - name: Validate consumer directory privacy contract
        run: python -m pytest -q -c /dev/null tests/goreecloud/test_consumer_directory.py

      - name: Compile consumer directory source
        run: python -m py_compile authentik/goreecloud/consumer_directory.py
