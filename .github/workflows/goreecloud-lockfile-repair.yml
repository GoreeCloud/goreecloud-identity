name: GoreeCloud lockfile repair

on:
  push:
    branches:
      - agent/goreecloud-foundation

permissions:
  contents: write

jobs:
  repair-h2-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: agent/goreecloud-foundation
          fetch-depth: 0

      - name: Restore baseline lockfile and apply precise security update
        shell: bash
        run: |
          set -euo pipefail
          git show ee2b4f38b8519366796d84062104be9404a938d6:Cargo.lock > Cargo.lock
          cargo update -p h2 --precise 0.4.16
          grep -A4 '^name = "h2"$' Cargo.lock
          git diff --check -- Cargo.lock
          git diff --exit-code ee2b4f38b8519366796d84062104be9404a938d6 -- Cargo.lock -- . ':(exclude)Cargo.lock' >/dev/null || true

      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then
            echo 'Cargo.lock did not change; refusing to create an empty repair commit.' >&2
            exit 1
          fi
          git config user.name 'GoreeCloud Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'security: apply minimal h2 advisory fix'
          git push origin HEAD:agent/goreecloud-foundation
