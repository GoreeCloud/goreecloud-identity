name: GoreeCloud lockfile repair

on:
  push:
    branches:
      - agent/goreecloud-foundation

permissions:
  contents: write

jobs:
  repair-h2-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out foundation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: agent/goreecloud-foundation
          fetch-depth: 0

      - name: Restore baseline lockfile and apply exact upstream advisory patch
        shell: bash
        run: |
          set -euo pipefail
          git show ee2b4f38b8519366796d84062104be9404a938d6:Cargo.lock > Cargo.lock
          python3 - <<'PY'
          from pathlib import Path

          path = Path("Cargo.lock")
          text = path.read_text()
          old = '''name = "h2"\nversion = "0.4.15"\nsource = "registry+https://github.com/rust-lang/crates.io-index"\nchecksum = "6cb093c84e8bd9b188d4c4a8cb6579fc016968d14c99882163cd3ff402a4f155"'''
          new = '''name = "h2"\nversion = "0.4.16"\nsource = "registry+https://github.com/rust-lang/crates.io-index"\nchecksum = "a9f37a958b41b3b19ee2707c06439c0e9e547e847223eb791ecb0cb821c65e27"'''
          if text.count(old) != 1:
              raise SystemExit("Expected exactly one vulnerable h2 lockfile entry")
          path.write_text(text.replace(old, new))
          PY
          grep -A4 '^name = "h2"$' Cargo.lock
          git diff --check -- Cargo.lock
          test "$(git diff --numstat ee2b4f38b8519366796d84062104be9404a938d6 -- Cargo.lock | awk '{print $1":"$2}')" = "2:2"
          git diff ee2b4f38b8519366796d84062104be9404a938d6 -- Cargo.lock | grep -Fq -- '-version = "0.4.15"'
          git diff ee2b4f38b8519366796d84062104be9404a938d6 -- Cargo.lock | grep -Fq -- '+version = "0.4.16"'
          git diff ee2b4f38b8519366796d84062104be9404a938d6 -- Cargo.lock | grep -Fq -- '-checksum = "6cb093c84e8bd9b188d4c4a8cb6579fc016968d14c99882163cd3ff402a4f155"'
          git diff ee2b4f38b8519366796d84062104be9404a938d6 -- Cargo.lock | grep -Fq -- '+checksum = "a9f37a958b41b3b19ee2707c06439c0e9e547e847223eb791ecb0cb821c65e27"'

      - name: Commit exact patched lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'GoreeCloud Automation'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock
          git commit -m 'security: apply exact h2 advisory patch'
          git push origin HEAD:agent/goreecloud-foundation
