name: GoreeCloud foundation guardrails

on:
  pull_request:
    paths:
      - "GOREECLOUD.md"
      - "UPSTREAM.md"
      - "README.md"
      - "docs/goreecloud/**"
      - "pyproject.toml"
      - "web/package.json"
      - "web/src/styles/global/brand/goreecloud.css"
      - "web/src/styles/interface.global.css"
      - "web/src/styles/flows.global.css"
      - "web/src/styles/static.global.css"
      - "LICENSE"
      - "web/LICENSE.txt"
      - "packages/theme/LICENSE.txt"
      - ".github/workflows/goreecloud-foundation.yml"
  push:
    branches:
      - main
    paths:
      - "GOREECLOUD.md"
      - "UPSTREAM.md"
      - "README.md"
      - "docs/goreecloud/**"
      - "pyproject.toml"
      - "web/package.json"
      - "web/src/styles/global/brand/goreecloud.css"
      - "web/src/styles/interface.global.css"
      - "web/src/styles/flows.global.css"
      - "web/src/styles/static.global.css"
      - "LICENSE"
      - "web/LICENSE.txt"
      - "packages/theme/LICENSE.txt"
      - ".github/workflows/goreecloud-foundation.yml"

permissions:
  contents: read

jobs:
  maintained-fork-boundary:
    name: Maintained-fork boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2

      - name: Verify required GoreeCloud records
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GOREECLOUD.md
            UPSTREAM.md
            docs/goreecloud/ARCHITECTURE.md
            docs/goreecloud/UI-CUSTOMIZATION.md
            docs/goreecloud/VALIDATION.md
            docs/goreecloud/WARDVEIL-SECURITY.md
            docs/goreecloud/OBSERVABILITY.md
            docs/goreecloud/PRODUCTION-READINESS.md
          )

          for path in "${required[@]}"; do
            test -f "$path" || {
              echo "Missing required GoreeCloud record: $path" >&2
              exit 1
            }
          done

      - name: Verify root documentation links
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'GOREECLOUD.md' README.md
          grep -Fq 'UPSTREAM.md' README.md

      - name: Preserve upstream license records
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f web/LICENSE.txt
          test -f packages/theme/LICENSE.txt

      - name: Prevent silent package-identity divergence
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^name = "authentik"$' pyproject.toml
          grep -Fq '"name": "@goauthentik/web"' web/package.json

      - name: Confirm maintained-fork language
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'goauthentik/authentik' GOREECLOUD.md
          grep -Fq 'goauthentik/authentik' UPSTREAM.md

      - name: Verify Glaze UI 1.0 product contract
        shell: bash
        run: |
          set -euo pipefail
          css=web/src/styles/global/brand/goreecloud.css
          test -f "$css"

          for marker in \
            '--glaze-canvas' \
            '--glaze-solid' \
            '--glaze-raised' \
            '--glaze-surface' \
            '--glaze-overlay' \
            '--glaze-target-min: 44px' \
            'prefers-reduced-motion: reduce' \
            'prefers-reduced-transparency: reduce' \
            'prefers-contrast: more' \
            'forced-colors: active' \
            'max-width: 599px' \
            'min-width: 600px' \
            'min-width: 1024px' \
            'min-width: 1440px' \
            ':focus-visible'; do
              grep -Fq -- "$marker" "$css" || {
                echo "Missing required Glaze UI marker: $marker" >&2
                exit 1
              }
          done

          for entrypoint in \
            web/src/styles/interface.global.css \
            web/src/styles/flows.global.css \
            web/src/styles/static.global.css; do
              grep -Fq '@import "#styles/global/brand/goreecloud.css" layer(brand);' "$entrypoint" || {
                echo "GoreeCloud brand layer is not loaded by $entrypoint" >&2
                exit 1
              }
          done

      - name: Verify Wardveil and readiness boundaries
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Wardveil Security by GoreeCloud' docs/goreecloud/WARDVEIL-SECURITY.md
          grep -Fq 'does not replace' docs/goreecloud/WARDVEIL-SECURITY.md
          grep -Fq 'Sensitive-data exclusions' docs/goreecloud/OBSERVABILITY.md
          grep -Fq 'unknown, skipped, unavailable, or unverified' docs/goreecloud/PRODUCTION-READINESS.md
          grep -Fq 'production cutover is approved separately' docs/goreecloud/PRODUCTION-READINESS.md
