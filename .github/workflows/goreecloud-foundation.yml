name: GoreeCloud foundation guardrails

on:
  pull_request:
    paths:
      - "GOREECLOUD.md"
      - "UPSTREAM.md"
      - "README.md"
      - "docs/goreecloud/**"
      - "contracts/**"
      - "pyproject.toml"
      - "web/package.json"
      - "LICENSE"
      - "web/LICENSE.txt"
      - "packages/theme/LICENSE.txt"
      - ".github/workflows/goreecloud-foundation.yml"
  push:
    branches:
      - main
    paths:
      - "GOREECLOUD.md"
      - "UPSTREAM.md"
      - "README.md"
      - "docs/goreecloud/**"
      - "contracts/**"
      - "pyproject.toml"
      - "web/package.json"
      - "LICENSE"
      - "web/LICENSE.txt"
      - "packages/theme/LICENSE.txt"
      - ".github/workflows/goreecloud-foundation.yml"

permissions:
  contents: read

jobs:
  native-migration-boundary:
    name: Native migration boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify required GoreeCloud records
        shell: bash
        run: |
          set -euo pipefail
          required=(
            GOREECLOUD.md
            UPSTREAM.md
            docs/goreecloud/ARCHITECTURE.md
            docs/goreecloud/UI-CUSTOMIZATION.md
            docs/goreecloud/VALIDATION.md
            contracts/identity.mesh-evidence-profile.json
            contracts/identity.evidence.schema.json
          )

          for path in "${required[@]}"; do
            test -f "$path" || {
              echo "Missing required GoreeCloud record: $path" >&2
              exit 1
            }
          done

      - name: Verify root documentation links
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'GOREECLOUD.md' README.md
          grep -Fq 'UPSTREAM.md' README.md

      - name: Preserve inherited license records
        shell: bash
        run: |
          set -euo pipefail
          test -f LICENSE
          test -f web/LICENSE.txt
          test -f packages/theme/LICENSE.txt

      - name: Preserve inherited package identity while present
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^name = "authentik"$' pyproject.toml
          grep -Fq '"name": "@goauthentik/web"' web/package.json

      - name: Enforce native target architecture
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'original GoreeCloud-owned native Identity software' GOREECLOUD.md
          grep -Fq 'does **not** define a permanent maintained-fork architecture' UPSTREAM.md
          if grep -Fq 'repository is a GoreeCloud-maintained fork' GOREECLOUD.md; then
            echo 'GOREECLOUD.md still declares a permanent maintained-fork product architecture' >&2
            exit 1
          fi

      - name: Validate GoreeCloud JSON contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m json.tool contracts/identity.mesh-evidence-profile.json > /dev/null
          python -m json.tool contracts/identity.evidence.schema.json > /dev/null
          python -m json.tool contracts/mesh-service-token.v1.json > /dev/null
