schema_version: '0.2'

component:
  type: service
  id: goreecloud-identity
  product_name: GoreeCloud Identity
  repository: GoreeCloud/goreecloud-identity

lifecycle: development
version: '0.3'

supported_platforms:
  - linux
  - web

api:
  versions: []
  endpoints: []

platform_systems:
  manager:
    result: applicable-blocked
    version: null
    evidence:
      - GOREECLOUD.md
      - identity-center-site/index.html
      - contracts/identity.evidence.schema.json
    notes: Manager may consume bounded Identity inventory, lifecycle, health, configuration, or platform evidence, but no accepted live Manager-to-Identity administrative integration is established by this source candidate.
  privacy_shield:
    result: applicable-blocked
    version: null
    evidence:
      - GOREECLOUD.md
      - contracts/identity.evidence.schema.json
      - contracts/identity.mesh-evidence-profile.json
    notes: Identity implements minimized evidence boundaries, but repository-local privacy behavior and evidence minimization do not establish accepted Privacy Shield integration or data-use authorization.
  wardveil_security:
    result: applicable-blocked
    version: null
    evidence:
      - GOREECLOUD.md
      - SECURITY.md
      - contracts/identity.evidence.schema.json
    notes: Identity is security-critical and contains source-level security controls, but accepted Wardveil Security integration and runtime protection evidence are not established.
  everkeep:
    result: applicable-blocked
    version: null
    evidence:
      - GOREECLOUD.md
      - identity-center-site/index.html
    notes: Backup, restore, break-glass access, signing-key recovery, continuity, portability, and clean-target recovery acceptance remain mandatory and are not established by this source candidate.
  glaze_ui:
    result: applicable-migration-required
    version: '1.1.0'
    evidence:
      - identity-center-site/glaze.lock.json
      - identity-center-site/index.html
      - scripts/build_identity_public_site.py
      - scripts/validate_identity_public_site.py
      - .github/workflows/validate-website.yml
      - WEBSITE.md
    notes: Identity Center source remains pinned to historical GLAZE UI V1.1 / 1.1.0 and therefore does not satisfy the current required GLAZE UI V1.3 / 1.3.0 Stable baseline. The V1.1 publication path also remains fail-closed because its immutable CSS graph is dependency-incomplete. Identity requires an explicit V1.3 migration, fresh exact-revision rendered/accessibility/resilience evidence, and deployed-byte verification before current Glaze conformance can be claimed.
  mesh:
    result: applicable-blocked
    version: null
    evidence:
      - contracts/identity.mesh-evidence-profile.json
      - contracts/mesh-service-token.v1.json
      - goreecloud_identity/mesh_delivery.py
      - authentik/goreecloud/mesh_service_token.py
      - authentik/goreecloud/mesh_service_token_views.py
      - .github/workflows/goreecloud-mesh-service-token.yml
      - tests/goreecloud/test_identity_mesh_delivery.py
      - tests/goreecloud/test_mesh_service_token.py
    notes: Source-level workload-bound Mesh service-token issuance, public JWKS verification, evidence delivery, and scoped registry permissions exist. Production signing-key custody, deployed JWKS trust, workload binding, rotation/revocation operations, live issuance/routing, and end-to-end Mesh acceptance remain pending.
    capabilities:
      - identity-evidence-producer
      - mesh-service-credential-issuer
    dependencies:
      - goreecloud-mesh
    published_events: []
    consumed_events: []
  identity:
    result: not-applicable-justified
    version: '0.3'
    evidence:
      - GOREECLOUD.md
      - identity-center-site/index.html
      - contracts/identity.evidence.schema.json
      - contracts/identity.mesh-evidence-profile.json
      - contracts/mesh-service-token.v1.json
    notes: This repository implements the GoreeCloud Identity authority itself; a separate Identity-to-Identity platform integration is not applicable.

health:
  health_endpoint: null
  readiness_endpoint: null

continuity:
  backup:
    required: true
    requirements:
      - Protect durable identity, account, authentication, authorization, session, application-registration, MFA, passkey/WebAuthn, audit, and required configuration state before production dependence.
      - Protect signing and encryption material through approved secret and recovery mechanisms without committing reusable secret material to Git or ordinary evidence stores.
  restore:
    required: true
    requirements:
      - Validate isolated clean-target restoration of required persistent state, signing/encryption material, authentication behavior, service identity, audit integrity, and administrative control before production or Stable qualification.
      - Validate an independently documented break-glass administrative path that does not depend exclusively on the failed Identity service.
  export:
    required: true
    requirements:
      - Provide documented portable export or migration paths for GoreeCloud-owned identity configuration and durable state where safe and applicable without exporting reusable credentials as ordinary data.
  portability:
    required: true
    requirements:
      - Preserve standards-based identity interoperability, service registrations, and migration paths so GoreeCloud is not permanently dependent on the inherited authentik-derived product architecture or one deployment environment.

external_dependencies:
  - name: PostgreSQL
    purpose: Persistent datastore used by the current transitional identity runtime and required for durable identity state until native architecture changes are accepted.
    required: true
    version_constraint: null

compatibility:
  platform_contract: '0.2'
  glaze_ui_required: '1.3.0'
  requires:
    - goreecloud-platform-contract==0.2
    - glaze-ui==1.3.0
  provides:
    - goreecloud-identity-evidence-v1
    - goreecloud-identity-mesh-service-token-v1

evidence:
  acceptance_tests: []
  release: []

conformance:
  status: nonconformant
  validated_at: null
  evidence:
    - AGENTS.md
    - README.md
    - GOREECLOUD.md
    - UPSTREAM.md
    - WEBSITE.md
    - identity-center-site/index.html
    - identity-center-site/glaze.lock.json
    - contracts/identity.evidence.schema.json
    - contracts/identity.mesh-evidence-profile.json
    - contracts/mesh-service-token.v1.json
    - goreecloud_identity/mesh_delivery.py
    - authentik/goreecloud/mesh_service_token.py
    - authentik/goreecloud/mesh_service_token_views.py
    - scripts/build_identity_public_site.py
    - scripts/validate_identity_public_site.py
    - tests/goreecloud/test_identity_evidence_contract.py
    - tests/goreecloud/test_identity_mesh_delivery.py
    - tests/goreecloud/test_mesh_service_token.py
  blockers:
    - GoreeCloud Identity remains in active native migration and the substantial authentik-derived runtime is transitional rather than the accepted permanent GoreeCloud architecture.
    - Production GoreeCloud-wide SSO and authentication cutover are not approved.
    - Production signing-key and private-key custody, rotation, revocation, recovery, and deployed JWKS acceptance remain incomplete.
    - Live GoreeCloud Mesh workload identity, service-token issuance, evidence delivery, and runtime acceptance remain pending despite source-level contracts and tests.
    - GoreeCloud Manager integration and acceptance are not established.
    - Privacy Shield integration and acceptance are not established.
    - Wardveil Security integration and acceptance are not established.
    - Everkeep backup, restore, key-recovery, break-glass, continuity, export, and portability acceptance are incomplete.
    - Identity Center is still pinned to historical GLAZE UI V1.1 / 1.1.0 while the required current Stable baseline is GLAZE UI V1.3 / 1.3.0; migration and current acceptance are outstanding.
    - The historical V1.1 publication path also has an incomplete immutable CSS import graph and remains intentionally fail-closed until migration replaces it with an accepted current Stable source.
    - Identity Center rendered Human Visual Excellence, exact production deployment, and deployed-byte acceptance remain outstanding.
    - Clean-environment Identity restore, break-glass recovery, monitoring, rollback, controlled application integration, and target-environment production acceptance remain outstanding.
    - Required Stable acceptance-test and published release evidence has not been produced.
