[workspace]
resolver = "2"
members = [
    "packages/authentik-axum",
    "packages/authentik-client",
    "packages/authentik-common",
    "packages/docsmg",
]

[workspace.package]
version = "2026.11.0-rc1"
edition = "2024"
rust-version = "1.91"
authors = ["authentik Team <hello@goauthentik.io>"]
license = "MIT"
repository = "https://github.com/goauthentik/authentik"

[workspace.dependencies]
arc-swap = "1.9.2"
argh = "0.1.19"
askama = "0.16.0"
async-trait = "0.1.89"
authentik-axum = { path = "packages/authentik-axum" }
authentik-client = { path = "packages/authentik-client" }
authentik-common = { path = "packages/authentik-common" }
aws-lc-rs = { version = "= 1.18.0", features = ["fips"] }
axum = { version = "= 0.8.9", features = ["http2", "macros", "ws"] }
axum-extra = { version = "0.12.6", features = ["cookie"] }
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
base64 = "0.23.1"
bytes = "1.11.1"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.6", features = ["derive"] }
colored = "3.1.1"
config = { version = "0.15.22", default-features = false, features = ["yaml"] }
console-subscriber = "0.5.0"
dotenvy = "0.15.7"
durstr = "0.5.1"
eyre = "0.6.14"
findshlibs = "0.10.2"
futures = "0.3.34"
glob = "0.3.4"
http = "1.4.0"
http-body-util = "0.1.5"
hyper = { version = "1.11.0", features = ["client", "http1", "http2", "server"] }
hyper-rustls = { version = "0.27.9", default-features = false, features = ["http1", "http2", "logging", "ring", "tls12", "webpki-roots"] }
hyper-unix-socket = "0.6.1"
hyper-util = { version = "0.1.20", features = ["client", "client-legacy", "http1", "http2", "server-auto", "service", "tokio"] }
ipnet = "2.12.1"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
moka = { version = "0.12.16", features = ["sync"] }
nix = { version = "0.31.3", features = ["signal"] }
once_cell = "1.21.4"
os_info = "3.14.0"
pem = "4.0.0"
percent-encoding = "2.3.2"
pyo3 = { version = "0.29.0", features = ["abi3-py312"] }
pyo3-build-config = "0.29.0"
rand = "0.10.2"
regex = "1.13.1"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls-no-provider", "system-proxy"] }
reqwest-middleware = "0.5.2"
rustls = { version = "= 0.23.45", features = ["fips"] }
sentry = "0.49.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_repr = "0.1.21"
serde_with = { version = "3.22.0", features = ["base64", "chrono", "hex", "time_0_3"] }
sqlx = { version = "0.9.0", features = ["postgres", "sqlite", "runtime-tokio", "tls-rustls-aws-lc-rs", "uuid", "chrono", "json", "macros"] }
tempfile = "3.27.0"
thiserror = "2.0.20"
time = { version = "0.3.55", features = ["macros", "serde", "formatting"] }
tokio = { version = "1.53.1", features = ["full"] }
tokio-retry2 = "0.9.1"
tokio-rustls = { version = "0.26.4", default-features = false, features = ["aws-lc-rs", "logging", "tls12"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
tower = { version = "0.5.3", features = ["balance", "buffer", "discover", "limit", "load", "retry", "timeout", "util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "compression-full", "cors", "fs", "normalize-path", "request-id", "sensitive-headers", "set-header", "trace", "validate-request"] }
tracing = "0.1.44"
tracing-error = "0.2.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "time"] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.24.0", features = ["serde", "v4"] }

[package]
name = "authentik"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "authentik"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "ak"
path = "src/bin/ak.rs"

[dependencies]
arc-swap.workspace = true
argh.workspace = true
askama.workspace = true
authentik-axum.workspace = true
authentik-client.workspace = true
authentik-common.workspace = true
aws-lc-rs.workspace = true
axum.workspace = true
axum-extra.workspace = true
axum-server.workspace = true
base64.workspace = true
color-eyre = "0.6.5"
eyre.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-rustls.workspace = true
hyper-unix-socket.workspace = true
hyper-util.workspace = true
jsonwebtoken.workspace = true
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
moka.workspace = true
nix.workspace = true
pem.workspace = true
percent-encoding.workspace = true
pyo3.workspace = true
pyo3-build-config.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
reqwest-middleware.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_repr.workspace = true
sqlx.workspace = true
tempfile.workspace = true
thiserror.workspace = true
time.workspace = true
tokio.workspace = true
tokio-retry2.workspace = true
tokio-tungstenite.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true

[build-dependencies]
pyo3-build-config.workspace = true

[features]
default = ["pyo3/extension-module"]
